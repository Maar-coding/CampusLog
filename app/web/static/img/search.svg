<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="32"
  height="32"
  viewBox="0 0 32 32"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 바깥 네모 테두리 -->
  <rect
    x="1.5"
    y="1.5"
    width="29"
    height="29"
    rx="4.5"
    ry="4.5"
    fill="none"
    stroke="#0C3E9A"
    stroke-width="2.5"
  />

  <!-- 렌즈 -->
  <circle
    cx="14"
    cy="14"
    r="7"
    fill="none"
    stroke="#0C3E9A"
    stroke-width="2.5"
  />

  <!-- 손잡이 (시작점을 원 안쪽으로 살짝) -->
  <line
    x1="21" y1="21"
    x2="24" y2="24"
    stroke="#0C3E9A"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
