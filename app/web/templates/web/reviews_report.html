<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../static/web/reviews.css">
</head>
<body>

<!-- 왼쪽 패널 영역 (이 div 안에 코딩하기) -->
<div class="panel_case">
    <div class="upload_container">
        <div class="upload_header">
            <div class="header_left">
                <button class="back_button" onclick="goBack()">
                    <span class="back_arrow">←</span>
                </button>
                <h1 class="upload_title">후기 신고</h1>
            </div>
        </div>

        <!-- 신고 폼 -->
        <form class="upload_form" id="reportForm">
            <!-- 신고 사유 선택 -->
            <div class="form_group">
                <label for="reportReason" class="form_label">신고 사유</label>
                <select id="reportReason" class="form_select" required>
                    <option value="">사유를 선택해주세요</option>
                    <option value="spam">스팸/광고</option>
                    <option value="inappropriate">부적절한 내용</option>
                    <option value="harassment">욕설/혐오 발언</option>
                    <option value="false_info">허위 정보</option>
                    <option value="copyright">저작권 침해</option>
                    <option value="other">기타</option>
                </select>
            </div>

            <!-- 상세 내용 -->
            <div class="form_group">
                <label for="reportDetail" class="form_label">상세 내용</label>
                <textarea id="reportDetail" class="form_textarea" placeholder="신고 사유에 대한 상세한 내용을 입력해주세요" required></textarea>
            </div>

            <!-- 버튼 영역 -->
            <div class="form_buttons">
                <button type="button" class="btn btn_cancel" onclick="cancelReport()">취소</button>
                <button type="submit" class="btn btn_report">신고</button>
            </div>
        </form>

        <!-- 신고 완료 메시지 -->
        <div class="upload_success_container" id="successMessage" style="display: none;">
            <div class="success_content">
                <div class="success_icon">✓</div>
                <h1 class="success_title">신고가 접수되었습니다</h1>
                <p class="success_message">
                    신고해주신 후기를 검토한 후<br>
                    적절한 조치를 취하겠습니다.
                </p>
            </div>
            <div class="success_buttons">
                <button class="btn_primary single_button" onclick="goToReviews()">
                    후기 목록으로 돌아가기
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// 신고 제출
document.getElementById('reportForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const reasonSelect = document.getElementById('reportReason');
    const detail = document.getElementById('reportDetail').value.trim();

    if (!reasonSelect.value) {
        alert('신고 사유를 선택해주세요.');
        return;
    }

    if (!detail) {
        alert('상세 내용을 입력해주세요.');
        return;
    }

    // 실제 구현에서는 서버로 신고 데이터 전송
    const reportData = {
        reason: reasonSelect.value,
        detail: detail,
        reviewId: getReviewIdFromUrl() // URL에서 후기 ID 추출
    };

    console.log('후기 신고 제출:', reportData);

    // 폼과 헤더 숨기고 성공 메시지 표시
    document.querySelector('.upload_container').innerHTML = `
        <div class="upload_success_container">
            <div class="success_content">
                <div class="success_icon">✓</div>
                <h1 class="success_title">신고가 접수되었습니다</h1>
                <p class="success_message">
                    신고해주신 후기를 검토한 후<br>
                    적절한 조치를 취하겠습니다.
                </p>
            </div>
            <div class="success_buttons">
                <button class="btn_primary single_button" onclick="goToReviews()">
                    후기 목록으로 돌아가기
                </button>
            </div>
        </div>
    `;
});

// URL에서 후기 ID 추출 (실제 구현에서 사용)
function getReviewIdFromUrl() {
    // 예시: ?reviewId=123 형태로 전달된다고 가정
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('reviewId') || 1;
}

// 취소 기능
function cancelReport() {
    if (confirm('신고를 취소하시겠습니까?')) {
        goBack();
    }
}

// 후기 목록으로 돌아가기
function goToReviews() {
    // 실제 구현에서는 후기 목록 페이지로 이동
    window.history.go(-2); // 신고 페이지와 상세 페이지를 건너뛰고 목록으로
}

// 뒤로가기 기능
function goBack() {
    window.history.back();
}
</script>

</body>
</html>
