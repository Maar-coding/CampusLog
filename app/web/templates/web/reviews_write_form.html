<!-- 왼쪽 패널 영역 (이 div 안에 코딩하기) -->
<div class="panel_case">
    <div class="upload_container">
        <div class="upload_header">
            <div class="header_left">
                <button class="back_button" onclick="changePanel('restaurant/{{ restaurant.id }}/reviews')">
                    <span class="back_arrow">←</span>
                </button>
                <h1 class="upload_title">후기 작성</h1>
            </div>
        </div>

        <form class="upload_form" id="reviewForm">
            <div class="form_group">
                <label class="form_label">제목</label>
                <input type="text" class="form_input" id="reviewTitle" placeholder="후기 제목을 입력하세요" required>
            </div>

            <div class="form_group">
                <label class="form_label">별점</label>
                <div class="rating_input">
                    <span class="rating_star" data-rating="1">★</span>
                    <span class="rating_star" data-rating="2">★</span>
                    <span class="rating_star" data-rating="3">★</span>
                    <span class="rating_star" data-rating="4">★</span>
                    <span class="rating_star" data-rating="5">★</span>
                    <span class="rating_text" id="ratingText">별점을 선택하세요</span>
                </div>
            </div>

            <div class="form_group">
                <label class="form_label">후기 내용</label>
                <textarea class="form_textarea" id="reviewContent" placeholder="후기 내용을 입력하세요" required></textarea>
            </div>

            <div class="form_group">
                <label class="form_label">사진 첨부</label>
                <div class="file_upload_area">
                    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                    <button type="button" class="file_upload_button" onclick="document.getElementById('imageInput').click()">
                        <span class="upload_icon">📷</span>
                        <span class="upload_text">사진 선택</span>
                    </button>
                    <div class="file_preview" id="imagePreview"></div>
                </div>
            </div>

            <div class="form_buttons">
                <button type="button" class="btn btn_cancel" onclick="changePanel('restaurant/{{ restaurant.id }}/reviews')">취소</button>
                <button type="submit" class="btn btn_submit">후기 등록</button>
            </div>
        </form>
    </div>
</div>
