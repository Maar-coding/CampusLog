<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>CampusLog</title>
    <link rel="stylesheet" href="../../static/web/style.css"/>
    <link rel="stylesheet" href="../../static/web/component.css"/>
    <link rel="stylesheet" href="../../static/web/search_panel.css"/>
    <link rel="stylesheet" href="../../static/web/login_panel.css"/>
    <link rel="stylesheet" href="../../static/web/register_panel.css">
    <link rel="stylesheet" href="../../static/web/restaurant.css">
    <link rel="stylesheet" href="../../static/web/reviews_panel.css">
    <link rel="stylesheet" href="../../static/web/reviews_write_panel.css">
    <link rel="stylesheet" href="../../static/web/board.css">
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8d908fe0cb6e1d79f77f01659a40a83e&libraries=services"></script>
</head>

<body>
    <div id="map"></div>

    <div class="filter_case">
        <img src="../../static/img/restaurant.png" class="filter_icon" id="restaurant">
        <img src="../../static/img/cafe.png" class="filter_icon" id="cafe">
        <img src="../../static/img/play.png" class="filter_icon" id="play">
    </div>

    <div class="panel_button" onclick="panelButton()">
        <img src="../../static/img/right_arrow.svg" class="panel_arrow">
    </div>

    <aside id="panel" style="display: none;"></aside>

    <div id="globalPopup" class="popup_overlay" style="display:none;">
        <div class="popup_box">
            <p class="popup_message" id="globalPopupMessage">알림 내용</p>
            <div class="popup_buttons">
                <button type="button" class="btn btn_primary" id="globalPopupConfirm">확인</button>
            </div>
        </div>
    </div>

    <script>
        // 전역변수
        let IS_AUTHENTICATED = {{ user.is_authenticated|lower }};
        let map, myMarker;
        const myImageSrc = "../../static/img/my_marker.svg";
        const markers = [];
        let storeData = [];
        let currentPanelFilter = null;
        let currentFilter = null;
        let currentPanel = "search";

        // 지도 초기화
        document.addEventListener('DOMContentLoaded', function () {
            const imageSize = new kakao.maps.Size(44, 66);
            const myMarkerImage = new kakao.maps.MarkerImage(myImageSrc, imageSize);

            function initMap(lat, lng) {
                const mapContainer = document.getElementById('map');
                map = new kakao.maps.Map(mapContainer, {
                    center: new kakao.maps.LatLng(lat, lng),
                    level: 3
                });

                myMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(lat, lng),
                    map: map,
                    image: myMarkerImage
                });

                loadRestaurantDataFromDB();
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => initMap(pos.coords.latitude, pos.coords.longitude),
                    () => {
                        alert('위치 접근 실패 (매화소 공원으로 위치를 설정합니다.)');
                        initMap(37.2787235583201, 127.910148105052);
                    }
                );
            } else {
                alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
                initMap(37.2787235583201, 127.910148105052);
            }

            panelButton();
        });

        // 유저 위치 로드
        fetch('/api/locations')
            .then(res => res.json())
            .then(data => {
                if(map) {
                    data.forEach(user => {
                        new kakao.maps.Marker({
                            map: map,
                            position: new kakao.maps.LatLng(user.lat, user.lng),
                        });
                    });
                }
            })
            .catch(err => console.log("유저 위치 로드 패스"));

        // 마커 생성
        function createMarker(lat, lng, tags, id) {
            const el = document.createElement("div");
            el.className = "store_marker";
            el.innerHTML = `<img src="${getMarkerImage(tags)}" class="store_marker_img">`;

            const overlay = new kakao.maps.CustomOverlay({
                position: new kakao.maps.LatLng(lat, lng),
                content: el,
                map: map
            });

            overlay.tags = tags;
            overlay.el = el;

            el.addEventListener("click", (e) => {
                e.stopPropagation();
                const panel = document.getElementById("panel");
                const btn = document.querySelector(".panel_button");
                const img = document.querySelector(".panel_arrow");

                panel.style.display = "block";
                if (btn) btn.classList.add("open");
                if (img) img.style.transform = "scaleX(-1)";

                openPanel("restaurant", id);
            });

            markers.push(overlay);
        }

        function getMarkerImage(tags) {
            if (tags.includes("restaurant")) return "../../static/img/restaurant.png";
            if (tags.includes("cafe")) return "../../static/img/cafe.png";
            return "../../static/img/play.png";
        }

        function filterMarkers(selectedTag) {
            markers.forEach(marker => {
                if (marker.tags.includes(selectedTag)) {
                    marker.el.classList.remove("marker_blur");
                } else {
                    marker.el.classList.add("marker_blur");
                }
            });
        }

        function toggleFilter(tag) {
            if (currentFilter === tag) {
                clearFilter();
                currentFilter = null;
                return;
            }
            currentFilter = tag;
            filterMarkers(tag);
        }

        function clearFilter() {
            markers.forEach(marker => marker.el.classList.remove("marker_blur"));
        }

        // 지도 필터 아이콘 클릭
        document.getElementById("restaurant").addEventListener("click", () => toggleFilter("restaurant"));
        document.getElementById("cafe").addEventListener("click", () => toggleFilter("cafe"));
        document.getElementById("play").addEventListener("click", () => toggleFilter("play"));

        // 패널 관련
        function panelButton() {
            const btn = document.querySelector('.panel_button');
            const img = document.querySelector('.panel_arrow');
            const panel = document.getElementById("panel");
            const isOpen = panel.style.display === "block";

            if (isOpen) {
                panel.style.display = "none";
                btn.classList.remove('open');
                img.style.transform = 'scaleX(1)';
            } else {
                btn.classList.add('open');
                img.style.transform = 'scaleX(-1)';
                let id = null;
                if (currentPanel === "restaurant" || currentPanel === "restaurant_reviews") {
                    id = localStorage.getItem("lastRestaurantId");
                }
                openPanel(currentPanel, id);
            }
        }

        function openPanel(panelName, id = null) {
            const panel = document.getElementById("panel");
            panel.style.display = "block";
            changePanel(panelName, id);
        }

        function changePanel(panelName, id = null) {
            if (panelName === 'board/write' && !IS_AUTHENTICATED) {
                openPopup('로그인이 필요합니다!');
                changePanel('login');
                return;
            }

            if (panelName.includes('reviews/write') && !IS_AUTHENTICATED) {
                openPopup('로그인이 필요합니다!');
                changePanel('login');
                return;
            }

            const panel = document.getElementById("panel");
            currentPanel = panelName;

            if (id !== null) {
                localStorage.setItem("lastRestaurantId", id);
            }

            let url = `/${panelName}`;
            if (panelName === "restaurant" && id) url = `/${panelName}/${id}`;
            else if (panelName === "restaurant_reviews" && id) url = `/restaurant/${id}/reviews`;
            else if (panelName === "board") {
                if (id) {
                    url = !isNaN(id) ? `/board/${id}` : `/board${id}`;
                }
            }

            fetch(url)
                .then(res => res.text())
                .then(html => {
                    panel.innerHTML = html;
                    initPanelByName(panelName, id);
                })
                .catch(err => console.error(`${panelName} 로딩 실패`, err));
        }

        function initPanelByName(panelName, id) {
            if (panelName === "search") {
                if (storeData.length > 0) {
                    renderStoreList(storeData);
                }
                initSortDropdown();
                initSearchPanel();
            }
            else if (panelName.includes("reviews/write")) {
                const parts = panelName.split('/');
                const restaurantId = parts[1];
                bindReviewFormEvent(restaurantId);
            }
            else if (panelName === "board/write") {
                bindPostFormEvent();
            }
        }

        // ⭐ 패널 필터 클릭
        function onFilterClick(tag, clickedEl) {
            console.log("필터 클릭:", tag); // 디버깅
            const filters = document.querySelectorAll('.search_panel_filter');

            if (currentPanelFilter === tag) {
                currentPanelFilter = null;
                renderStoreList(storeData);
                filters.forEach(img => img.classList.remove('blurred-filter'));
                return;
            }

            currentPanelFilter = tag;
            loadStores(tag);

            filters.forEach(img => {
                if (img === clickedEl) img.classList.remove('blurred-filter');
                else img.classList.add('blurred-filter');
            });
        }

        function loadStores(tag) {
            if (!storeData || storeData.length === 0) return;
            const filtered = storeData.filter(store => store.tags.includes(tag));
            console.log("필터링 결과:", filtered); // 디버깅
            renderStoreList(filtered);
        }

        function initSortDropdown() {
            const button = document.getElementById("sort_dropdown_button");
            const menu = document.getElementById("sort_dropdown_menu");

            if (!button || !menu) {
                console.log("드롭다운 요소 없음");
                return;
            }

            console.log("드롭다운 초기화 성공");

            // ⭐ 복제 대신 직접 이벤트 제거
            button.replaceWith(button.cloneNode(true));
            const newButton = document.getElementById("sort_dropdown_button");

            const items = menu.querySelectorAll(".dropdown_list");

            // ⭐ 버튼 클릭 이벤트
            newButton.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log("드롭다운 버튼 클릭!");
                menu.classList.toggle("open");
            });

            // ⭐ 항목 클릭 이벤트
            items.forEach(item => {
                item.addEventListener("click", function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const text = this.textContent;
                    console.log("정렬 선택:", text);

                    // 버튼 텍스트 변경
                    newButton.childNodes[0].textContent = text;

                    // 메뉴 닫기
                    menu.classList.remove("open");

                    // 정렬 실행
                    handleSort(text);
                });
            });

            // ⭐ 외부 클릭 시 메뉴 닫기
            document.addEventListener("click", function(e) {
                if (!newButton.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.remove("open");
                }
            });
        }



        function handleSort(type) {
            console.log("정렬 실행:", type);
            let dataToSort = storeData;
            if (currentPanelFilter) {
                dataToSort = storeData.filter(store => store.tags.includes(currentPanelFilter));
            }

            let sorted = [...dataToSort];

            if (type === "가나다순") {
                sorted.sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));
            }
            else if (type === "별점순") {
                sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            }
            else if (type === "리뷰개수순") {
                sorted.sort((a, b) => (b.reviewCount || 0) - (a.reviewCount || 0));
            }

            console.log("정렬 결과:", sorted);
            renderStoreList(sorted);
        }

        function loadRestaurantDataFromDB() {
            fetch('/api/restaurants')
                .then(res => res.json())
                .then(data => {
                    console.log("식당 데이터 로드 완료:", data);
                    storeData = data;

                    storeData.forEach(store => {
                        createMarker(store.lat, store.lng, store.tags, store.id);
                    });

                    if (currentPanel === "search") {
                        renderStoreList(storeData);
                    }
                })
                .catch(err => console.error("식당 데이터 로드 실패:", err));
        }

        function renderStoreList(list) {
            const container = document.getElementById("store_list");
            const template = document.getElementById("store_card_template");

            if (!container || !template) return;

            container.innerHTML = "";

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="no_result" style="text-align:center; padding:20px;">검색 결과가 없습니다.</p>`;
                return;
            }

            list.forEach(store => {
                const clone = template.content.cloneNode(true);
                const card = clone.querySelector(".store_card");
                card.dataset.id = store.id;

                const imgEl = clone.querySelector(".store_img");
                imgEl.src = store.image || "../../static/img/play.png";

                clone.querySelector(".store_name").textContent = store.name;
                clone.querySelector(".store_time").textContent = store.time;

                const reviewBtn = clone.querySelector(".store_review");
                reviewBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    openReviewPanel("restaurant_reviews", store.id);
                });

                card.addEventListener("click", function() {
                    openPanel("restaurant", store.id);
                });

                container.appendChild(clone);
            });
        }

        function openReviewPanel(panelName, id) {
            changePanel(panelName, id);
        }

        function runSearch() {
            const input = document.getElementById("search_input");
            if (!input) return;

            const keyword = input.value.trim().toLowerCase();

            if (!keyword) {
                renderStoreList(storeData);
                return;
            }

            const filtered = storeData.filter(store =>
                store.name.toLowerCase().includes(keyword)
            );
            renderStoreList(filtered);
        }

        function initSearchPanel() {
            const input = document.getElementById("search_input");
            const button = document.querySelector(".search_button");

            if (input) {
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") runSearch();
                });
            }

            if (button) {
                button.addEventListener("click", () => runSearch());
            }

            const panelFilters = document.querySelectorAll('.search_panel_filter');
            console.log("패널 필터 개수:", panelFilters.length);

            panelFilters.forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);

                newBtn.addEventListener("click", function(e) {
                    e.stopPropagation();
                    const tag = this.getAttribute('data-filter');
                    console.log("패널 필터 클릭:", tag);
                    onFilterClick(tag, this);
                });
            });
        }

        function openPopup(message, onConfirm) {
            const overlay = document.getElementById("globalPopup");
            const msgEl = document.getElementById("globalPopupMessage");
            const btn = document.getElementById("globalPopupConfirm");

            if (!overlay || !msgEl || !btn) {
                alert(message);
                return;
            }

            msgEl.textContent = message;
            overlay.style.display = "flex";

            btn.onclick = () => {
                overlay.style.display = "none";
                if (typeof onConfirm === "function") {
                    onConfirm();
                }
            };
        }

        function handleRegisterSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method || "POST",
                body: formData,
                headers: { "X-Requested-With": "XMLHttpRequest" },
            })
            .then(async (res) => {
                const html = await res.text();
                const panel = document.getElementById("panel");

                if (html.includes("중복") || html.includes("존재하는")) {
                    openPopup("이미 사용 중인 아이디입니다.");
                    return;
                }
                if (html.includes('id="registerError"')) {
                    panel.innerHTML = html;
                    return;
                }
                if (!res.ok) {
                    openPopup("서버 오류가 발생했습니다.");
                    return;
                }
                openPopup("회원가입에 성공하였습니다!", () => changePanel("login"));
            })
            .catch(err => openPopup("네트워크 오류 발생"));
            return false;
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: formData,
                headers: { "X-Requested-With": "XMLHttpRequest" },
                redirect: "follow"
            })
            .then(async (res) => {
                const html = await res.text();
                const panel = document.getElementById("panel");

                if (!res.ok && !res.redirected) {
                    openPopup("로그인 서버 오류");
                    return;
                }

                if (!res.redirected && html.includes('id="loginError"')) {
                    panel.innerHTML = html;
                    return;
                }

                IS_AUTHENTICATED = true;
                openPopup("로그인에 성공하였습니다!", () => changePanel("search"));
            })
            .catch(err => openPopup("네트워크 오류 발생"));
            return false;
        }

        function bindReviewFormEvent(restaurantId) {
            const form = document.getElementById("reviewForm");
            if (!form) return;

            form.addEventListener("submit", function(e) {
                e.preventDefault();
                submitReviewAjax(form, restaurantId);
            });
        }

        function submitReviewAjax(form, restaurantId) {
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': getCsrfToken() }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    openPopup("리뷰가 성공적으로 등록되었습니다!", function() {
                        changePanel('restaurant_reviews', restaurantId);
                    });
                } else {
                    let errorMsg = "입력 정보를 확인해주세요.";
                    if(data.errors) {
                        errorMsg += "\n" + JSON.stringify(data.errors);
                    }
                    openPopup(errorMsg);
                }
            })
            .catch(err => {
                console.error("전송 실패:", err);
                openPopup("서버 통신 중 오류가 발생했습니다.");
            });
        }

        function bindPostFormEvent() {
            const form = document.getElementById("postForm");
            const fileInput = document.getElementById("imageUpload");

            if (!form) return;

            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    const preview = document.getElementById('filePreview');
                    preview.innerHTML = '';

                    if (file && file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const imageDiv = document.createElement('div');
                            imageDiv.className = 'preview_item';
                            imageDiv.innerHTML = `
                                <img src="${e.target.result}" class="preview_image" alt="미리보기">
                                <button type="button" class="remove_image" onclick="clearImageInput()">×</button>
                            `;
                            preview.appendChild(imageDiv);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            form.addEventListener("submit", function(e) {
                e.preventDefault();
                submitPostAjax(form);
            });
        }

        function clearImageInput() {
            const fileInput = document.getElementById("imageUpload");
            const preview = document.getElementById('filePreview');
            if (fileInput) fileInput.value = '';
            if (preview) preview.innerHTML = '';
        }

        function submitPostAjax(form) {
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': getCsrfToken() }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showSuccessScreen(data.post_id);
                } else {
                    alert("작성 실패: " + JSON.stringify(data.errors));
                }
            })
            .catch(err => {
                console.error("게시글 전송 오류:", err);
                alert("서버 통신 중 오류가 발생했습니다.");
            });
        }

        function showSuccessScreen(postId) {
            document.getElementById('boardHeader').style.display = 'none';
            document.getElementById('postForm').style.display = 'none';

            const successContainer = document.getElementById('successContainer');
            successContainer.style.display = 'flex';

            const viewBtn = document.getElementById('btnViewPost');
            if(postId && viewBtn) {
                viewBtn.onclick = () => changePanel('board');
            }
        }

        function getCsrfToken() {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, 10) === ('csrftoken' + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(10));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
