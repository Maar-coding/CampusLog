<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>CampusLog</title>
    <!-- 패널의 css파일 연동 모두 여기서 하기 -->
    <link rel="stylesheet" href="../../static/web/style.css"/>
    <link rel="stylesheet" href="../../static/web/component.css"/>
    <link rel="stylesheet" href="../../static/web/search_panel.css"/>
    <link rel="stylesheet" href="../../static/web/login_panel.css"/>
    <link rel="stylesheet" href="../../static/web/register_panel.css">
    <link rel="stylesheet" href="../../static/web/restaurant.css">
    <link rel="stylesheet" href="../../static/web/reviews.css">
    <!-- 카카오 Maps API 불러오기 (이동하 개인 키 값) -->
     <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8d908fe0cb6e1d79f77f01659a40a83e&libraries=services"></script>
</head>

<body>
    <div id="map"></div>

    <div class="filter_case">
        <img src="../../static/img/restaurant.png" class="filter_icon" id="restaurant">
        <img src="../../static/img/cafe.png" class="filter_icon" id="cafe">
        <img src="../../static/img/play.png" class="filter_icon" id="play">
    </div>

    <div class="panel_button" onclick="panelButton()">
        <img src="../../static/img/right_arrow.svg" class="panel_arrow">
    </div>

    <!-- 기본 패널 (component.css) -->
    <aside id="panel" style="display: none;"></aside>


    <script>
        // 전역변수 선언
        let map;
        let myMarker;
        const myImageSrc = "../../static/img/my_marker.svg"; // 내 마커 이미지

        const markers = [];

        // HTMl이 로드 된 다음에 실행 (카카오맵 불러올 때 오류 제거)
        document.addEventListener('DOMContentLoaded', function () {

            const imageSize = new kakao.maps.Size(44, 66); // 마커 이미지 크기 (가로, 세로)
            const myMarkerImage = new kakao.maps.MarkerImage(myImageSrc, imageSize); // 내 마커 이미지 객체 생성

            // 지도 초기화
            function initMap(lat, lng) {
                const mapContainer = document.getElementById('map'); // "map" div에 지도 표시
                const mapOption = {
                    center: new kakao.maps.LatLng(lat, lng), // 지도의 중심 좌표(아래에서 가져온 내 위치)
                    level: 3 // 지도 확대 레벨
                };

                map = new kakao.maps.Map(mapContainer, mapOption); // 지도 생성

                // 내 마커 생성
                myMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(lat, lng),
                    map: map,
                    image: myMarkerImage
                });

                // 매장 마커 리스트
                loadRestaurantDataFromDB();
            }

            // 내 위치 가져오기
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    const lat = position.coords.latitude;   // 내 위도
                    const lng = position.coords.longitude;  // 내 경도
                    initMap(lat, lng);
                }, function (error) {
                    alert('위치 접근 실패');
                });
            } else {
                alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
            }
        });

        // 유저 좌표 받아오기
        fetch('/api/locations') // 경로로 GET 요청
        .then(res => res.json())
        .then(data => {
            data.forEach(user => {
                const marker = new kakao.maps.Marker({
                    map: map, // 마커 찍을 지도 지정
                    position: new kakao.maps.LatLng(user.lat, user.lng), // 마커 위치 지정
                });

            });
        });


        // 매장 마커 관련 코드

        // 필터가 적용됐나 여부
        let currentFilter = null;

        // 매장 마커 만들기 코드
        function createMarker(lat, lng, tags, id) {
            const el = document.createElement("div");
            el.className = "store_marker";

            // 여기서 이미지 자동 선택
            const imgSrc = getMarkerImage(tags);

            // HTML 삽입
            el.innerHTML = `<img src="${imgSrc}" class="store_marker_img">`;

            const overlay = new kakao.maps.CustomOverlay({
                position: new kakao.maps.LatLng(lat, lng),
                content: el,
                map: map
            });

            overlay.tags = tags;      // 태그 정보 저장
            overlay.el = el;          // DOM 저장 (CSS 적용용)

            // 식당 마커 누르면 식당 정보 패널 열기
            el.addEventListener("click", (e) => {
                e.stopPropagation();

                const panelName = `restaurant/${id}`;      // 열고 싶은 패널 이름
                currentPanel = panelName;        // panelButton()에서 참고하는 값 업데이트

                const panel = document.getElementById("panel");
                const btn   = document.querySelector(".panel_button");
                const img   = document.querySelector(".panel_arrow");

                // 패널 보이기 + 버튼 상태 '열림'
                panel.style.display = "block";
                if (btn) btn.classList.add("open");
                if (img) img.style.transform = "scaleX(-1)";

                // ⭐ 패널 열기 (openPanel → changePanel 흐름 그대로 탑승)
                openPanel(panelName, id);
            });


            markers.push(overlay);
            return overlay;
        }

        // 태그별로 마커 이미지 적용
        function getMarkerImage(tags) {
            if (tags.includes("restaurant")) return "../../static/img/restaurant.png";
            if (tags.includes("cafe")) return "../../static/img/cafe.png";
            return "../../static/img/play.png";
        }

        // 매장 마커 필터 실행
        function filterMarkers(selectedTag) {
            markers.forEach(marker => {
                if (marker.tags.includes(selectedTag)) {
                    marker.el.classList.remove("marker_blur"); // 기본
                } else {
                    marker.el.classList.add("marker_blur");    // 흐림 효과
                }
            });
        }

        // 필터링 해제 함수
        function toggleFilter(tag) {
            // 같은 태그를 다시 누르면
            if (currentFilter === tag) {
                clearFilter();
                currentFilter = null;
                return;
            }

            // 다른 태그를 누르면 → 해당 태그로 필터 변경
            currentFilter = tag;
            filterMarkers(tag);
        }

        // 필터링 해제 함수
        function clearFilter() {
            markers.forEach(marker => {
                marker.el.classList.remove("marker_blur");
            });
        }




        // 필터 아이콘 클릭 시 필터링 실행
        document.getElementById("restaurant").addEventListener("click", () => {
            toggleFilter("restaurant");
        });

        document.getElementById("cafe").addEventListener("click", () => {
            toggleFilter("cafe");
        });

        document.getElementById("play").addEventListener("click", () => {
            toggleFilter("play");
        });



        // 패널 관련 JS
        let currentPanel = "search";     // 마지막으로 열린 패널

        // 패널 여닫기
        // 패널 버튼 누를 때 작동
        function panelButton() {
            const btn = document.querySelector('.panel_button');  // 패널 버튼
            const img = document.querySelector('.panel_arrow');   // 패널 버튼 화살표
            const panel = document.getElementById("panel");
            const isOpen = panel.style.display === "block";

            // 패널이 열려있으면 닫기
            if (isOpen) {
                panel.style.display = "none";
                btn.classList.remove('open');        // 버튼 이동
                img.style.transform = 'scaleX(1)';   // 버튼 속 화살표 좌우 반전
                return;
            }

            // 패널이 닫혀있으면 열기
            // -> 마지막으로 연 패널 (처음이면 검색 패널)
            const panelName = currentPanel;
            btn.classList.add('open');            // 버튼 이동
            img.style.transform = 'scaleX(-1)';   // 버튼 속 화살표 좌우 반전
            openPanel(panelName);
        }

        // 패널 열기
        function openPanel(panelName, id = null) {
            const panel = document.getElementById("panel");

            panel.style.display = "block";   // 패널 틀 보여주기
            changePanel(panelName, id);          // 내부 내용 교체
        }

        // 패널 내용 교체
        function changePanel(panelName, id = null) {
            const panel = document.getElementById("panel");

            currentPanel = panelName;      
            currentId = id;

            // id가 있으면 무조건 localStorage 저장 (업데이트됨. 절대 쌓이지 않음)
            if (id !== null) {
                localStorage.setItem("lastRestaurantId", id);
                console.log("localStorage 저장:", id);
            }

            let url = `/${panelName}`;

            // restaurant 패널이면 /restaurant/3 형태로
            if (panelName === "restaurant" && id) {
                url = `/${panelName}/${id}`;
            }

            fetch(url)
                .then(res => res.text())
                .then(html => {
                    panel.innerHTML = html;
                    initPanelByName(panelName, id);
                })
                .catch(err => console.error(`${panelName}_panel.html 로딩 실패`, err));
        }

        
        function initPanelByName(panelName,id) {
            // search_panel.html이 로드된 경우에만 실행
            if (panelName === "search") {
                onFilterClick();
                loadStores();
                initSortDropdown();
                handleSort("가나다순");
                initSearchPanel();
            }
            else if (panelName === "restaurant_write_form") {
                initRatingStars();
                highlightStars();
                updateStarDisplay();
                initImageUpload();
                displayImagePreview();
                removeImage();
                initForm();
                submitReview();
                showSuccessPage();
            }
            // 나중에 다른 패널들도 생기면 이렇게 추가하면 됨
            // else if (panelName === "store") {
            //     initStorePanel();
            // }
            // else if (panelName === "review") {
            //     initReviewPanel();
            // }
        }

        function renderStoreList(list) {
            const container = document.getElementById("store_list");
            const template = document.getElementById("store_card_template");

            container.innerHTML = "";

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="no_result">검색 결과가 없습니다.</p>`;
                return;
            }

            list.forEach(store => {
                const clone = template.content.cloneNode(true);

                // store_card div에 id 주입
                const card = clone.querySelector(".store_card");
                card.dataset.id = store.id;

                clone.querySelector(".store_img").src = store.image;
                clone.querySelector(".store_name").textContent = store.name;
                clone.querySelector(".store_time").textContent = store.time;

                // "식당 세부정보" 클릭 이벤트 연결
                const datdBtn = clone.querySelector(".store_name");
                datdBtn.addEventListener("click", function () {
                    const id = card.dataset.id;       // ⭐ 카드에서 id 가져오기
                    openReviewPanel("restaurant", id);
                });

                // "후기 보기" 클릭 이벤트 연결
                const reviewBtn = clone.querySelector(".store_review");
                reviewBtn.addEventListener("click", function () {
                    const id = card.dataset.id;       // ⭐ 카드에서 id 가져오기
                    openReviewPanel("restaurant_reviews", id);
                });

                container.appendChild(clone);
            });
        }

        function openReviewPanel(panelName = "restaurant_reviews", id = null) {
            const panel = document.getElementById("panel");
            currentPanel = panelName;

            if (!id) {
                console.error("openReviewPanel 호출 시 id 없음");
                return;
            }

            if (id === restaurant_panel) {
                const url = `/restaurant/${id}`;
            }

            else if (id === restaurant_reviews) {
                const url = `/restaurant/${id}/reviews`;
            }

            else if (id === restaurant_reviews_write) {
                const id = localStorage.getItem("lastRestaurantId");
                const url = `/restaurant/${id}/reviews/write`;
            }

            fetch(url)
                .then(res => res.text())
                .then(html => {
                    panel.innerHTML = html;
                    initPanelByName(panelName, id);
                })
                .catch(err => console.error(`${url} 로딩 실패`, err));
        }





        // search_panel.html

        

        // 매장 필터링 함수
        function onFilterClick(tag, clickedEl) {
            // 1) 기존 식당 필터링
            loadStores(tag);

            // 2) 모든 필터 버튼을 순회하면서 블러 처리
            const filters = document.querySelectorAll('.search_panel_filter');

            filters.forEach(img => {
                if (img === clickedEl) {
                    // 클릭된 버튼: 블러 제거
                    img.classList.remove('blurred-filter');
                } else {
                    // 나머지 2개: 블러 적용
                    img.classList.add('blurred-filter');
                }
            });
        }

        function loadStores(tag) {
            
            // 식당이 없다면
            if (!storeData || storeData.length === 0) {
                console.warn("storeData가 아직 비었습니다. 먼저 loadRestaurantDataFromDB()를 호출하세요.");
                return;
            }

            const filtered = storeData.filter(store => store.tags.includes(tag));

            // 패널 리스트만 필터링해서 다시 렌더링
            renderStoreList(filtered);
        }




        // 정렬방법 드롭다운 텍스트 바꾸기
        function initSortDropdown() {
            const button = document.getElementById("sort_dropdown_button");
            const menu = document.getElementById("sort_dropdown_menu");

            // 요소 못 찾으면 바로 종료 (다른 패널에서 불렸을 때 대비)
            if (!button || !menu) {
                console.warn("정렬 드롭다운 요소를 찾지 못했습니다.");
                return;
            }

            // menu == NULL이면 오류, 오류방지 위치 (위 코드에서 잡아줌)
            const items = menu.querySelectorAll(".dropdown_list");

            // 버튼 클릭 → 메뉴 열기/닫기
            button.addEventListener("click", (e) => {
                e.stopPropagation();
                menu.classList.toggle("open");
            });

            // li 클릭 이벤트 등록
            items.forEach(item => {
                item.addEventListener("click", () => {

                    // 1️⃣ 버튼 텍스트 변경
                    button.childNodes[0].textContent = item.textContent;

                    // 2️⃣ 드롭다운 닫기
                    menu.classList.remove("open");

                    // 3️⃣ 선택된 항목에 따라 함수 실행
                    handleSort(item.textContent);
                });
            });

            // 바깥 클릭하면 닫기
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".dropdown")) {
                    menu.classList.remove("open");
                }
            });
        }

        // 회원가입 폼 AJAX 제출 + 성공 팝업 → 로그인 패널 이동
        // 회원가입 폼 AJAX 제출 + 성공 팝업 → 로그인 패널 이동
        function handleRegisterSubmit(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method || "POST",
                body: formData,
                headers: {
                    "X-Requested-With": "XMLHttpRequest",
                },
            })
                    .then(async (res) => {
                        const html = await res.text();       // 응답 본문 텍스트로 읽기
                        const panel = document.getElementById("panel");

                        // 1️⃣ 중복 아이디 케이스 탐지 (응답 내용으로 판단)
                        //   → Network 탭 Response 안에 실제 문구에 맞춰서 수정해도 됨
                        if (
                                html.includes("중복된 아이디") ||
                                html.includes("이미 존재하는 아이디")
                        ) {
                            openPopup("이미 사용 중인 아이디입니다.\n다른 아이디를 사용해 주세요.");
                            return;
                        }

                        // 2️⃣ 템플릿에서 form.errors / error_message 로 렌더된 경우
                        if (html.includes('id="registerError"')) {
                            panel.innerHTML = html;   // 에러 포함된 register 패널 다시 렌더링
                            return;
                        }

                        // 3️⃣ 여기까지 왔는데 상태 코드가 200이 아니면 → 진짜 서버 오류 취급
                        if (!res.ok) {
                            console.error("회원가입 서버 오류:", res.status);
                            openPopup(
                                    "회원가입 중 서버 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요."
                            );
                            return;
                        }

                        // 4️⃣ 모든 에러 조건에 안 걸렸으면 → 회원가입 성공으로 간주
                        openPopup("회원가입에 성공하였습니다!", () => {
                            // 확인 누르면 로그인 패널로 이동
                            changePanel("login");
                        });
                    })
                    .catch((err) => {
                        console.error("회원가입 요청 실패", err);
                        openPopup(
                                "네트워크 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요."
                        );
                    });

            return false;
        }


        // 로그인 폼 AJAX 제출 + 실패 시 패널 안에서만 갱신 + 성공 시 팝업 후 search 패널로 이동
        function handleLoginSubmit(event) {
            event.preventDefault();  // 기본 폼 전송 막기

            const form = event.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method || "POST",
                body: formData,
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                },
                redirect: "follow"   // 기본값이지만 명시
            })
                    .then(async (res) => {
                        const html = await res.text();      // 응답 전체를 문자열로
                        const panel = document.getElementById("panel");

                        // 🔹 1) 진짜 서버 오류 (500 등)
                        if (!res.ok && !res.redirected) {
                            console.error("로그인 서버 오류:", res.status);
                            openPopup("로그인 중 서버 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요.");
                            return;
                        }

                        // 🔹 2) 로그인 실패 케이스
                        //    - Django 기본 LoginView는 실패 시 redirect 없이 로그인 템플릿을 다시 렌더링
                        //    - 그 템플릿 안에 우리가 만든 id="loginError"가 들어 있음
                        if (!res.redirected && html.includes('id="loginError"')) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(html, "text/html");
                            const loginPanel = doc.querySelector(".panel_case.login_panel");

                            if (loginPanel) {
                                // 패널 영역만 다시 교체
                                panel.innerHTML = loginPanel.outerHTML;
                            } else {
                                // 혹시 구조가 달라졌으면 그대로 넣어서라도 에러 메시지 보이게
                                panel.innerHTML = html;
                            }
                            return;
                        }

                        // 🔹 3) 여기까지 왔으면 = 대부분 "로그인 성공" (리다이렉트가 있었던 경우)
                        openPopup("로그인에 성공하였습니다!", () => {
                            // 팝업의 확인 버튼을 누르면, 패널 내용만 search 패널로 교체
                            changePanel("search");
                        });
                    })
                    .catch((err) => {
                        console.error("로그인 요청 실패", err);
                        openPopup("네트워크 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요.");
                    });

            return false;   // onsubmit="return handleLoginSubmit(event)" 에서 기본 제출 막기
        }


        // 정렬방법 드롭다운 선택시 함수 실행
        // 정렬방법 선택시 API 호출 기준 변경
        function handleSort(type) {
            if (type === "가나다순")      loadRestaurants("name");
            else if (type === "별점순")   loadRestaurants("rating");
            else if (type === "거리순")   loadRestaurants("distance");
            else if (type === "리뷰개수순") loadRestaurants("review");
        }

        // ✅ storeData 기준으로 정렬해서 화면에 뿌리는 함수
        function loadRestaurants(sortKey) {
            // 기존 데이터 복사
            let sorted = [...storeData];

            if (sortKey === "name") {
                sorted.sort((a, b) => a.name.localeCompare(b.name)); // 가나다순
            }

            // 별점, 거리, 리뷰개수는 나중에 데이터 생기면 추가
            // else if (sortKey === "rating") { ... }
            // else if (sortKey === "distance") { ... }
            // else if (sortKey === "review") { ... }

            renderStoreList(sorted);
        }


        // 백엔드 데이터 연동으로 변경 필요

        /* ---------------------------
        1) 식당 데이터 리스트
        ---------------------------- */
        let storeData = [];

        // 2. 백엔드에서 데이터 가져오는 함수 생성
        function loadRestaurantDataFromDB() {
            fetch('/api/restaurants') // 우리가 만든 API 호출
                .then(res => res.json())
                .then(data => {
                    console.log("식당 데이터 로드 완료:", data);

                    // (1) 전역 변수 storeData 업데이트
                    storeData = data;

                    // (2) 지도에 마커 찍기
                    storeData.forEach(store => {
                        createMarker(store.lat, store.lng, store.tags, store.id);
                    });

                     // (3) 패널에 리스트 렌더링 (초기화)
                    renderStoreList(storeData);
                })
                .catch(err => console.error("식당 데이터 로드 실패:", err));
        }


        /* ---------------------------
        2) 리스트 렌더 함수
        ---------------------------- */
        function renderStoreList(list) {
            const container = document.getElementById("store_list");
            const template = document.getElementById("store_card_template");

            container.innerHTML = "";

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="no_result">검색 결과가 없습니다.</p>`;
                return;
            }

            list.forEach(store => {
                const clone = template.content.cloneNode(true);

                // ⭐ store_card div에 id 주입
                const card = clone.querySelector(".store_card");
                card.dataset.id = store.id;

                clone.querySelector(".store_img").src = store.image;
                clone.querySelector(".store_name").textContent = store.name;
                clone.querySelector(".store_time").textContent = store.time;

                // ⭐ "후기 보기" 클릭 이벤트 연결
                const reviewBtn = clone.querySelector(".store_review");
                reviewBtn.addEventListener("click", function () {
                    const id = card.dataset.id;       // ⭐ 카드에서 id 가져오기
                    openReviewPanel("restaurant_reviews", id);
                });

                container.appendChild(clone);
            });
        }

        function openReviewPanel(panelName = "restaurant_reviews", id = null) {
            const panel = document.getElementById("panel");
            currentPanel = panelName;

            if (!id) {
                console.error("openReviewPanel 호출 시 id 없음");
                return;
            }

            const url = `/restaurant/${id}/reviews`;

            fetch(url)
                .then(res => res.text())
                .then(html => {
                    panel.innerHTML = html;
                    initPanelByName(panelName, id);
                })
                .catch(err => console.error(`${url} 로딩 실패`, err));
        }


        /* ---------------------------
        3) 검색 실행 함수
        ---------------------------- */
        function runSearch() {
            const keyword = document.getElementById("search_input").value.trim().toLowerCase();

            if (!keyword) {
                renderStoreList(storeData);  // 검색어 없으면 전체 출력
                return;
            }

            const filtered = storeData.filter(store =>
                store.name.toLowerCase().includes(keyword)
            );

            renderStoreList(filtered);
        }


        /* ---------------------------
        4) 검색 패널 초기화 함수
        ---------------------------- */
        function initSearchPanel() {
            const input = document.getElementById("search_input");
            const button = document.querySelector(".search_button");

            // 엔터 입력 시 실행
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    runSearch();
                }
            });

            // 검색 버튼 클릭 시 실행
            button.addEventListener("click", () => {
                runSearch();
            });

            // 패널 처음 열릴 때 전체 리스트 출력
            renderStoreList(storeData);
        }

        function openPopup(message, onConfirm) {
          const overlay = document.getElementById("globalPopup");
          const msgEl = document.getElementById("globalPopupMessage");
          const btn = document.getElementById("globalPopupConfirm");

          if (!overlay || !msgEl || !btn) return;

          msgEl.textContent = message;
          overlay.style.display = "flex";

          btn.onclick = () => {
            overlay.style.display = "none";
            if (typeof onConfirm === "function") {
              onConfirm();
            }
          };
        }


        // 페이지 로드되면 패널 열기
        document.addEventListener("DOMContentLoaded", function () {
            panelButton();
        });

        // search_panel.html
        // ㅇㅇ님 환영합니다. 텍스트 삽입
        document.addEventListener("DOMContentLoaded", async function () {
            try {
                const res = await fetch("/api/user/");
                const data = await res.json();

                const nicknameEl = document.getElementById("nicknameArea");

                if (nicknameEl) {
                    nicknameEl.innerText = `${data.nickname}님 환영합니다.`;
                }
            }
            catch(err) {
                console.error("닉네임 가져오기 실패:", err);
            }
        });




        // reviews_write_form.html
        let selectedRating = 0;
        let selectedImages = [];

        document.addEventListener('DOMContentLoaded', function() {
            initRatingStars();
            initImageUpload();
            initForm();
        });

        function initRatingStars() {
            const stars = document.querySelectorAll('.rating_star');
            const ratingText = document.getElementById('ratingText');

            stars.forEach((star, index) => {
                star.addEventListener('click', function() {
                    selectedRating = index + 1;
                    updateStarDisplay();
                    ratingText.textContent = `${selectedRating}점`;
                });

                star.addEventListener('mouseenter', function() {
                    highlightStars(index + 1);
                });
            });

            document.querySelector('.rating_input').addEventListener('mouseleave', function() {
                updateStarDisplay();
            });
        }

        function highlightStars(rating) {
            const stars = document.querySelectorAll('.rating_star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('hover');
                } else {
                    star.classList.remove('hover');
                }
            });
        }

        function updateStarDisplay() {
            const stars = document.querySelectorAll('.rating_star');
            stars.forEach((star, index) => {
                star.classList.remove('hover');
                if (index < selectedRating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }

        function initImageUpload() {
            const imageInput = document.getElementById('imageInput');
            const imagePreview = document.getElementById('imagePreview');

            imageInput.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                selectedImages = files;
                displayImagePreview(files);
            });
        }

        function displayImagePreview(files) {
            const imagePreview = document.getElementById('imagePreview');
            imagePreview.innerHTML = '';

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview_item';
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="미리보기" class="preview_image">
                        <button type="button" class="remove_image" onclick="removeImage(${index})">×</button>
                    `;
                    imagePreview.appendChild(previewItem);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            displayImagePreview(selectedImages);
        }

        function initForm() {
            const form = document.getElementById('reviewForm');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                submitReview();
            });
        }

        function submitReview() {
            const title = document.getElementById('reviewTitle').value;
            const content = document.getElementById('reviewContent').value;

            if (!title.trim()) {
                alert('제목을 입력하세요.');
                return;
            }

            if (!content.trim()) {
                alert('후기 내용을 입력하세요.');
                return;
            }

            if (selectedRating === 0) {
                alert('별점을 선택하세요.');
                return;
            }

            // 후기 등록 로직
            console.log('후기 등록:', {
                title,
                content,
                rating: selectedRating,
                images: selectedImages
            });

            showSuccessPage();
        }

        function showSuccessPage() {
            document.querySelector('.panel_case').innerHTML = `
                <div class="upload_success_container">
                    <div class="success_content">
                        <div class="success_icon">✓</div>
                        <h1 class="success_title">후기 등록 완료</h1>
                        <p class="success_message">후기가 성공적으로 등록되었습니다.<br>다른 사람들에게 도움이 되는 후기를 작성해 주셔서 감사합니다!</p>
                    </div>
                    <div class="success_buttons">
                        <button class="btn_primary single_button" onclick="goBack()">후기 목록으로</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
