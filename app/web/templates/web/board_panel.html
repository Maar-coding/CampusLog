<!-- 왼쪽 패널 영역 (이 div 안에 코딩하기) -->
<div class="panel_case">
    <div class="board_container">
        <!-- 뒤로가기 버튼과 게시판 헤더 -->
        <div class="board_header">
            <div class="header_left">
                <button class="back_button" onclick="changePanel('search_panel')">
                    <span class="back_arrow">←</span>
                </button>
                <h1 class="board_title">커뮤니티 게시판</h1>
            </div>
        </div>

        <!-- 검색 영역 -->
        <div class="search_area">
            <input type="text" class="search_input" placeholder="제목, 내용으로 검색" id="searchInput">
            <button class="search_button" onclick="searchPosts()">검색</button>
        </div>

        <!-- 게시글 목록 -->
        <div class="post_list" id="postList">
            <!-- 로딩 상태 -->
            <div class="loading" id="loading">
                게시글을 불러오는 중...
            </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination" id="pagination" style="display: none;">
            <button class="page_button" onclick="changePage('prev')" id="prevBtn">‹</button>
            <div id="pageNumbers"></div>
            <button class="page_button" onclick="changePage('next')" id="nextBtn">›</button>
        </div>

        <!-- 글쓰기 버튼 (오른쪽 아래 고정) -->
        <button class="floating_write_button" onclick="changePanel('board/write')">
            <span class="write_icon">✏️</span>
            <span class="write_text">게시글 쓰기</span>
        </button>
    </div>
</div>
