{% load static %}

<div class="panel_case">
    <div class="board_container">
        <!-- 뒤로가기 버튼과 게시판 헤더 -->
        <div class="board_header">
            <div class="header_left">
                <button class="back_button" onclick="changePanel('board')">
                    <span class="back_arrow">←</span>
                </button>
                <h1 class="board_title">게시글 상세</h1>
            </div>
            <div class="header_right">
                <button class="menu_button" onclick="toggleMenu()">
                    <span class="menu_dots">⋮</span>
                </button>
                <div class="menu_dropdown" id="menuDropdown" style="display: none;">
                    <button class="menu_item" onclick="reportPost()">신고하기</button>
                </div>
            </div>
        </div>

        <!-- 게시글 상세 내용 -->
        <div class="post_detail">
            <!-- 게시글 헤더 -->
            <div class="detail_header">
                <h2 class="detail_title">{{ post.title }}</h2>
                <div class="detail_meta">
                    <span class="detail_author">{{ post.author.username }}</span>
                    <span class="detail_date">{{ post.created_at|date:"Y-m-d H:i" }}</span>
                </div>
                <div class="detail_stats">
                    <span class="detail_views">조회 {{ post.views|default:0 }}</span>
                    <span class="detail_likes">좋아요 23</span>
                </div>
            </div>

            <!-- 게시글 내용 -->
            <div class="detail_content">
                <div class="content_text">
                    {{ post.content|linebreaksbr }}
                </div>

                <!-- 첨부 이미지 -->
                {% if post.images %}
                <div class="content_images">
                    <img src="{{ post.images.url }}" alt="게시글 이미지" class="content_image">
                </div>
                {% endif %}
            </div>

            <!-- 액션 버튼 -->
            <div class="detail_actions">
                <button class="action_btn like_btn" onclick="toggleLike()">
                    <span class="like_icon">♡</span>
                    좋아요
                </button>
            </div>

            <!-- 댓글 섹션 -->
            <div class="comments_section">
                <div class="comments_header">
                    <h3 class="comments_title">댓글 <span class="comments_count">0</span></h3>
                </div>

                <!-- 댓글 작성 -->
                <div class="comment_write">
                    <textarea class="comment_input" id="commentInput" placeholder="댓글을 입력하세요..."></textarea>
                    <button class="comment_submit" onclick="addComment()">댓글 작성</button>
                </div>

                <!-- 댓글 목록 -->
                <div class="comments_list" id="commentsList">
                    <div class="no_comments">첫 번째 댓글을 작성해보세요!</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 메뉴 토글
function toggleMenu() {
    const dropdown = document.getElementById('menuDropdown');
    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
}

// 좋아요 토글
function toggleLike() {
    alert('좋아요 기능은 추후 구현 예정입니다.');
}

// 댓글 작성
function addComment() {
    const input = document.getElementById('commentInput');
    if(input.value.trim()) {
        alert('댓글 기능은 추후 구현 예정입니다.');
        input.value = '';
    } else {
        alert('댓글을 입력해주세요.');
    }
}

// 신고하기
function reportPost() {
    alert('신고 기능은 추후 구현 예정입니다.');
    document.getElementById('menuDropdown').style.display = 'none';
}

// 메뉴 외부 클릭 시 닫기
document.addEventListener('click', function(e) {
    const menuButton = document.querySelector('.menu_button');
    const dropdown = document.getElementById('menuDropdown');
    
    if (menuButton && dropdown && !menuButton.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
    }
});
</script>
