<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../static/web/login_panel.css">
</head>
<body>
<!-- 왼쪽 패널 영역 (이 div 안에 코딩하기) -->
<div class="panel_case">
  <div class="login_wrap">
      <header class="login_top">
  <button type="button" class="back_button" onclick="goBack()">
    <span class="back_icon">←</span>
    <span>뒤로 가기</span>
  </button>
</header>



    <div class="login_card">
      <!-- 제목만 남기고, 간단하게 -->
      <h2 class="login_title">로그인</h2>

      <form class="login_form" method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form_group">
          <label for="id_username" class="form_label">아이디</label>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form_input"
            placeholder="아이디"
            required
          />
        </div>

        <div class="form_group">
          <label for="id_password" class="form_label">비밀번호</label>
          <input
            type="password"
            id="id_password"
            name="password"
            class="form_input"
            placeholder="비밀번호"
            required
          />
        </div>

        {% if form.errors %}
        <p class="form_error" id="loginError">
          아이디 또는 비밀번호를 다시 확인해 주세요.
        </p>
        {% endif %}

        <div class="login_button_group">
          <button type="submit" class="btn btn_primary">로그인</button>
          <button type="button" class="btn btn_secondary" onclick="goToRegister()">
            회원가입 하러가기
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function goBack() {
    window.location.href = "{% url 'index' %}";
  }

  function goToRegister() {
    window.location.href = "{% url 'register' %}";
  }
</script>
</body>

</html>
