<div class="panel_case">
    <div class="board_container">
        <!-- 헤더 -->
        <div class="board_header" id="boardHeader">
            <div class="header_left">
                <!-- 뒤로가기: 목록으로 이동 -->
                <button class="back_button" onclick="changePanel('board')">
                    <span class="back_arrow">←</span>
                </button>
                <h1 class="board_title">게시글 작성</h1>
            </div>
        </div>

        <!-- 성공 화면 (숨김 상태) -->
        <div class="upload_success_container" id="successContainer" style="display: none;">
            <div class="success_content">
                <div class="success_icon">✓</div>
                <h2 class="success_title">게시글이 성공적으로<br>등록되었습니다!</h2>
            </div>
            <div class="success_buttons">
                <!-- 작성된 글로 이동 (JS에서 id 채워줌) -->
                <button class="btn btn_primary" id="btnViewPost">게시글 보기</button>
                <button class="btn btn_secondary" onclick="changePanel('board')">목록으로</button>
            </div>
        </div>

        <!-- 작성 폼 -->
        <!-- id="postForm"은 JS에서 이벤트를 연결할 때 사용합니다 -->
        <form class="post_form" id="postForm" action="{% url 'board/write' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- 제목 -->
            <div class="form_group">
                <label for="postTitle" class="form_label">제목</label>
                <!-- name="title" 필수 -->
                <input type="text" id="postTitle" name="title" class="form_input" placeholder="제목을 입력하세요" required>
            </div>

            <!-- 내용 -->
            <div class="form_group">
                <label for="postContent" class="form_label">내용</label>
                <!-- name="content" 필수 -->
                <textarea id="postContent" name="content" class="form_textarea" placeholder="내용을 입력하세요" required></textarea>
            </div>

            <!-- 사진 첨부 -->
            <div class="form_group">
                <label class="form_label">사진 첨부</label>
                <div class="file_upload_area">
                    <!-- name="images" 필수. 모델이 ImageField(단일)이므로 multiple 제거 -->
                    <input type="file" id="imageUpload" name="images" accept="image/*" style="display: none;">

                    <button type="button" class="file_upload_button" onclick="document.getElementById('imageUpload').click()">
                        <span class="upload_icon">🖼️</span>
                        사진 선택
                    </button>

                    <!-- 미리보기 영역 -->
                    <div class="file_preview" id="filePreview"></div>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="form_buttons">
                <button type="button" class="btn btn_cancel" onclick="changePanel('board')">취소</button>
                <button type="submit" class="btn btn_submit">업로드</button>
            </div>
        </form>
    </div>
</div>
